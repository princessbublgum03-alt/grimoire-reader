--------------------------------------------------------------- */
let activeSheet = null;
function openSheet(title, bodyHTML) {
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title">${escHTML(title)}</div>
        <button class="icon-btn sheet-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body">${bodyHTML}</div>
    </div>
  `;
  document.body.appendChild(ov);
  const close = () => { ov.classList.remove('open'); setTimeout(() => ov.remove(), 240); if (activeSheet === ov) activeSheet = null; };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('.sheet-close').addEventListener('click', close);
  requestAnimationFrame(() => ov.classList.add('open'));
  ov._close = close; ov._body = ov.querySelector('.sheet-body');
  activeSheet = ov;
  return ov;
}

function closeSheet() { if (activeSheet && activeSheet._close) activeSheet._close(); activeSheet = null; }

function confirmDialog(text, okLabel = 'OK') {
  return new Promise(resolve => {
    let settled = false;
    const settle = v => { if (!settled) { settled = true; resolve(v); } };
    const ov = openSheet('Подтверждение', `
      <div class="scroll-body"><p style="text-align:left">${escHTML(text)}</p></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px">
        <button class="btn-ghost" data-act="cancel">Отмена</button>
        <button class="btn-ghost btn-solid" data-act="ok">${escHTML(okLabel)}</button>
      </div>
    `);
    ov._body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      settle(b.dataset.act === 'ok');
      closeSheet();
    });
    const origClose = ov._close;
    ov._close = () => { origClose(); settle(false); };
  });
}

async function showToc() {
  if (!state.current) return;
  const book = state.current;
  const ov = openSheet('Содержание', `
    <div class="tabs">
      <button data-tab="toc" class="on">Главы</button>
      <button data-tab="notes">Заметки</button>
      <button data-tab="glossary">Глоссарий</button>
    </div>
    <div id="toc-content"></div>
  `);
  const content = ov._body.querySelector('#toc-content');

  const renderToc = () => {
    let html = '';
    if (book.format === 'epub') {
      html = state.toc.length ? state.toc.map(t => `<button class="toc-item" data-href="${escHTML(t.href)}">${escHTML(t.label)}</button>`).join('') : '<p class="hint">Нет оглавления.</p>';
    } else {
      html = (state.chapters || []).map((c, i) => `<button class="toc-item ${i === state.chapterIndex ? 'active' : ''}" data-index="${i}">${escHTML(c.title || ('Часть '+(i+1)))}</button>`).join('');
    }
    content.innerHTML = html;
  };

  const renderNotes = async () => {
    content.innerHTML = '<div class="spinner" style="margin:20px auto;display:block"></div>';
    const notes = (await DB.getAll('notes') || []).filter(n => n.bookId === book.id).sort((a,b) => b.timestamp - a.timestamp);
    if (!notes.length) return content.innerHTML = '<p class="hint">Заметок пока нет. Выделите текст и нажмите «Цитата».</p>';
    content.innerHTML = notes.map(n => `
      <div style="padding:12px 0; border-bottom:1px solid var(--line)">
        <div style="font-size:10px; color:var(--muted); margin-bottom:6px; text-transform:uppercase;">${escHTML(n.chapter || '—')}</div>
        <div style="font-family:var(--serif); font-size:14px; color:var(--accent); font-style:italic; border-left:2px solid var(--accent); padding-left:8px; margin-bottom:8px;">${escHTML(n.text)}</div>
        <div style="font-size:14px; line-height:1.5;">${escHTML(n.comment)}</div>
      </div>
    `).join('');
  };

  const renderGlossary = async () => {
    content.innerHTML = '<div class="spinner" style="margin:20px auto;display:block"></div>';
    const list = (await DB.getAll('glossary') || []).filter(g => g.bookId === book.id);
    if (!list.length) return content.innerHTML = '<p class="hint">Глоссарий пуст.</p>';
    content.innerHTML = list.map(g => `
      <button class="toc-item" data-term="${escHTML(g.display || g.term)}">
        <span style="display:block;color:var(--accent);font-size:15px">${escHTML(g.display || g.term)}</span>
        <span style="display:block;font-size:12px;color:var(--muted);margin-top:4px">${escHTML((g.note||'').slice(0,100))}</span>
      </button>
    `).join('');
  };

  renderToc();
  ov._body.querySelector('.tabs').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]'); if (!btn) return;
    ov._body.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === btn));
    if (btn.dataset.tab === 'toc') renderToc();
    else if (btn.dataset.tab === 'notes') renderNotes();
    else renderGlossary();
  });

  content.addEventListener('click', async e => {
    const item = e.target.closest('.toc-item'); if (!item) return;
    if (item.dataset.href) { closeSheet(); try { await state.rendition.display(item.dataset.href); } catch(err){} }
    else if (item.dataset.index !== undefined) { closeSheet(); renderChapter(parseInt(item.dataset.index, 10), 0); }
    else if (item.dataset.term) { closeSheet(); setTimeout(() => openTerm(item.dataset.term), 220); }
  });
}

function bindSettingsBody(root) {
  // Tabs
  root.querySelector('#set-theme').addEventListener('click', e => {
    const b = e.target.closest('[data-theme]'); if (!b) return;
    settings.theme = b.dataset.theme; applySettings(); saveSettings(); applyEpubTheme();
    root.querySelectorAll('#set-theme button').forEach(x => x.classList.toggle('on', x === b));
  });
  root.querySelector('#set-font').addEventListener('click', e => {
    const b = e.target.closest('[data-font]'); if (!b) return;
    settings.fontFamily = b.dataset.font; applySettings(); saveSettings(); applyEpubTheme();
    root.querySelectorAll('#set-font button').forEach(x => x.classList.toggle('on', x === b));
  });
  
  // Sliders
  const bindSlider = (id, key, labelId, fmt, cb) => {
    const el = root.querySelector(id); if (!el) return;
    el.addEventListener('input', () => {
      settings[key] = parseFloat(el.value);
      if (labelId) { const l = root.querySelector(labelId); if (l) l.textContent = fmt(settings[key]); }
      applySettings(); saveSettings(); if (cb) cb();
    });
  };
  bindSlider('#set-fs', 'fontSize', '#lbl-fs', v => v + ' px', applyEpubTheme);
  bindSlider('#set-lh', 'lineHeight', '#lbl-lh', v => v.toFixed(2), applyEpubTheme);
  bindSlider('#set-night', 'nightFilter', null, null, () => {
    const btn = root.querySelector('[data-toggle="night"]');
    if (btn) btn.classList.toggle('on', settings.nightFilter > 0);
  });
  bindSlider('#set-rsvp', 'rsvpSpeed', '#lbl-rsvp', v => v);
  bindSlider('#set-autoscroll', 'autoScrollSpeed', null, null);
  bindSlider('#set-tts', 'ttsRate', '#lbl-tts', v => v);

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.toggle;
      if (type === 'night') {
        settings.nightFilter = settings.nightFilter > 0 ? 0 : 30;
        root.querySelector('#set-night').value = settings.nightFilter;
      } else if (type === 'focus') {
        settings.focusMode = !settings.focusMode;
        updateFocus();
      }
      btn.classList.toggle('on', type === 'night' ? settings.nightFilter > 0 : settings.focusMode);
      applySettings(); saveSettings();
    });
  });

  // Export & Stats
  const statsLbl = root.querySelector('#stats-lbl');
  DB.get('kv', 'stats').then(st => {
    if (st) statsLbl.textContent = `Прочитано: ~${st.minutes} мин · ~${st.words} слов`;
    else statsLbl.textContent = 'Статистика пуста';
  }).catch(()=>{});

  root.querySelector('#btn-export').addEventListener('click', async () => {
    const notes = await DB.getAll('notes') || [];
    const gl = await DB.getAll('glossary') || [];
    const bm = await DB.getAll('bookmarks') || [];
    const data = { notes, glossary: gl, bookmarks: bm, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `grimoire-backup-${Date.now()}.json`; a.click();
    toast('Данные экспортированы');
  });

  root.querySelector('#btn-wipe').addEventListener('click', async () => {
    if (!(await confirmDialog('Удалить все книги, заметки и прогресс?', 'Удалить всё'))) return openSettings();
    await DB.clear('books'); await DB.clear('files'); await DB.clear('progress');
    await DB.clear('glossary'); await DB.clear('notes'); await DB.clear('bookmarks'); await DB.clear('kv');
    Object.keys(fullTextCache).forEach(k => delete fullTextCache[k]); coverCache.clear();
    closeSheet(); await loadLibrary(); toast('Всё удалено');
  });
}

function openSettings() {
  const ov = openSheet('Настройки', settingsBody());
  bindSettingsBody(ov._body);
}

/* ---------------------------------------------------------------
   15. Плавающая кнопка (Выделение)
--------------------------------------------------------------- */
function showTermPill(text) {
  const pill = $('#term-pill');
  state.selection = text;
  pill.hidden = false;
  requestAnimationFrame(() => pill.classList.add('show'));
}
function hideTermPill() {
  const pill = $('#term-pill');
  pill.classList.remove('show');
  setTimeout(() => { pill.hidden = true; }, 260);
  state.selection = '';
}
function captureSelection() {
  setTimeout(() => {
    let text = '';
    try {
      const sel = window.getSelection();
      text = sel ? sel.toString().replace(/\s+/g, ' ').trim() : '';
    } catch (e) {}
    if (text && text.length >= 2 && text.length <= 300) showTermPill(text);
    else hideTermPill();
  }, 30);
}

/* ---------------------------------------------------------------
   16. Обработчики событий
--------------------------------------------------------------- */
function bindEvents() {
  const fileInput = $('#file-input'), folderInput = $('#folder-input');
  $('#btn-import').addEventListener('click', () => fileInput.click());
  $('#btn-import-2').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => { if (e.target.files.length) await handleFiles(e.target.files, false); e.target.value = ''; });

  if ('webkitdirectory' in document.createElement('input')) {
    $('#btn-import-folder').style.display = '';
    $('#btn-import-folder-2').style.display = '';
    const clickFolder = () => folderInput.click();
    $('#btn-import-folder').addEventListener('click', clickFolder);
    $('#btn-import-folder-2').addEventListener('click', clickFolder);
    folderInput.addEventListener('change', async e => { if (e.target.files.length) await handleFiles(e.target.files, true); e.target.value = ''; });
  }

  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-theme').addEventListener('click', () => {
    const i = THEMES.indexOf(settings.theme);
    settings.theme = THEMES[(i + 1) % THEMES.length];
    applySettings(); saveSettings(); applyEpubTheme();
    toast('Тема: ' + THEME_NAMES[settings.theme]);
  });
  $('#btn-night').addEventListener('click', () => {
    settings.nightFilter = settings.nightFilter > 0 ? 0 : 30;
    applySettings(); saveSettings();
    $('#btn-night').classList.toggle('active', settings.nightFilter > 0);
  });

  $('#grid').addEventListener('click', async e => {
    const del = e.target.closest('.book-del');
    if (del) { e.stopPropagation(); await deleteBook(del.closest('.book-card').dataset.id); return; }
    const card = e.target.closest('.book-card');
    if (card) await openBook(card.dataset.id);
  });

  /* Reader controls */
  $('#btn-close-reader').addEventListener('click', closeReader);
  $('#btn-next').addEventListener('click', goNext);
  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-summary').addEventListener('click', showSummary);
  $('#btn-toc').addEventListener('click', showToc);
  $('#btn-reader-settings').addEventListener('click', openSettings);
  $('#btn-search').addEventListener('click', showSearchSheet);
  $('#btn-rsvp').addEventListener('click', startRSVP);
  $('#btn-autoscroll').addEventListener('click', toggleAutoScroll);
  $('#btn-tts').addEventListener('click', async () => speakText(await currentChapterText()));

  /* Quick Nav */
  $('#quick-nav').addEventListener('change', e => {
    const idx = parseInt(e.target.value, 10);
    if (state.rendition) {
       const item = state.epub.spine.spineItems[idx];
       if (item) state.rendition.display(item.href);
    } else {
       renderChapter(idx, 0);
    }
  });

  /* Reader Body Events */
  $('#reader-body').addEventListener('scroll', () => {
    if (state.current && state.current.format !== 'epub') {
      setPercent((state.chapterIndex + customRatio()) / (state.chapters || [1]).length);
      saveCustomProgress(); updateFocus();
    }
  }, { passive: true });

  $('#reader-body').addEventListener('click', e => {
    const note = e.target.closest('.note-ref');
    if (note) {
      const id = note.dataset.note;
      const html = (state.notes && state.notes[id]) || '<p>Сноска не найдена.</p>';
      openSheet('Сноска', '<div class="scroll-body">' + html + '</div>');
      return;
    }
    if (window.getSelection().toString().trim()) return;
    setBars(!state.barsVisible);
  });

  $('#reader-body').addEventListener('mouseup', captureSelection);
  $('#reader-body').addEventListener('touchend', captureSelection);
  
  $('#reader-body').addEventListener('touchstart', e => {
    if (e.touches.length === 1) { state.touchStartX = e.touches[0].clientX; state.touchStartY = e.touches[0].clientY; }
  }, { passive: true });
  $('#reader-body').addEventListener('touchend', handleSwipe);

  /* Term Pill */
  $('#term-pill').addEventListener('pointerdown', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const act = btn.dataset.act;
    const text = state.selection;
    if (act === 'term') openTerm(text);
    else if (act === 'note') showNoteSheet(text);
    else if (act === 'speak') speakText(text);
  });
  
  document.addEventListener('pointerdown', e => {
    if (!$('#term-pill').contains(e.target) && $('#term-pill').classList.contains('show')) {
      if (!window.getSelection().toString().trim()) hideTermPill();
    }
  }, true);

  /* RSVP Controls */
  $('#btn-rsvp-close').addEventListener('click', stopRSVP);
  $('#btn-rsvp-play').addEventListener('click', () => {
    if (rsvpInterval) pauseRSVP();
    else playRSVP();
  });
  $('#rsvp-speed').addEventListener('input', e => {
    settings.rsvpSpeed = parseInt(e.target.value, 10);
    $('#rsvp-speed-label').textContent = settings.rsvpSpeed + ' слов/мин';
    if (rsvpInterval) playRSVP(); // restart with new speed
    saveSettings();
  });

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (activeSheet) { closeSheet(); return; }
      if (!$('#rsvp-overlay').hidden) { stopRSVP(); return; }
      if (!$('#reader').hidden) { closeReader(); return; }
    }
    if (!activeSheet && $('#reader').hidden === false && $('#rsvp-overlay').hidden === true) {
      if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); }
    }
  });

  window.addEventListener('resize', debounce(() => {
    if (state.rendition) { try { state.rendition.resize(); applyEpubTheme(); } catch (e) {} }
    updateFocus();
  }, 250));
}

/* ---------------------------------------------------------------
   17. Инициализация
--------------------------------------------------------------- */
(async function init() {
  initPWA();
  await loadSettings();
  applySettings();
  
  // Обновляем состояние кнопки ночного фильтра
  if (settings.nightFilter > 0) $('#btn-night').classList.add('active');

  try { await DB.getAll('books'); } catch (e) { toast('Хранилище недоступно', 5000); }
  await loadLibrary();
  bindEvents();

  const boot = $('#boot');
  if (boot) { boot.style.transition = 'opacity .4s'; boot.style.opacity = '0'; setTimeout(() => boot.remove(), 420); }
})();
</script>
