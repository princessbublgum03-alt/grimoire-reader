let activeSheet = null;

function openSheet(title, bodyHTML) {
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay';

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML =
    '<div class="sheet-head">' +
      '<div class="sheet-title"></div>' +
      '<button class="icon-btn sheet-close" aria-label="Закрыть">' +
        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
    '</div>' +
    '<div class="sheet-body"></div>';

  sheet.querySelector('.sheet-title').textContent = title;
  sheet.querySelector('.sheet-body').innerHTML = bodyHTML;

  ov.appendChild(sheet);
  document.body.appendChild(ov);

  const close = () => {
    if (!ov.parentNode) return;
    ov.classList.remove('open');
    setTimeout(() => ov.remove(), 240);
    if (activeSheet === ov) activeSheet = null;
  };

  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  sheet.querySelector('.sheet-close').addEventListener('click', close);

  requestAnimationFrame(() => ov.classList.add('open'));

  ov._close = close;
  ov._body = sheet.querySelector('.sheet-body');
  activeSheet = ov;
  return ov;
}

function closeSheet() {
  if (activeSheet && activeSheet._close) activeSheet._close();
  activeSheet = null;
}

function confirmDialog(text, okLabel = 'OK') {
  return new Promise(resolve => {
    const ov = openSheet('Подтверждение',
      '<div class="scroll-body"><p style="text-align:left">' + escHTML(text) + '</p></div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:22px">' +
        '<button class="btn-ghost" data-act="cancel" style="padding:10px 18px;letter-spacing:.18em">Отмена</button>' +
        '<button class="btn-ghost btn-solid" data-act="ok" style="padding:10px 18px;letter-spacing:.18em">' + escHTML(okLabel) + '</button>' +
      '</div>');
    ov._body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      closeSheet();
      resolve(b.dataset.act === 'ok');
    });
    ov._close = ((orig) => () => { orig(); resolve(false); })(ov._close);
  });
}

/* ---------------------------------------------------------------
   19. «Суть»
--------------------------------------------------------------- */
async function showSummary() {
  if (!state.current) return;
  const ov = openSheet('Суть',
    '<div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.16em">' +
      '<span class="spinner"></span> извлекаю тезисы…</div>');

  let text = '';
  try { text = await currentChapterText(); } catch (e) {}

  if (!text || text.trim().length < 180) {
    ov._body.innerHTML = '<p class="hint">В этой главе слишком мало текста для анализа.</p>';
    return;
  }

  const theses = summarize(text, 4);
  if (!theses.length) {
    ov._body.innerHTML = '<p class="hint">Не удалось выделить тезисы.</p>';
    return;
  }

  let html = '<div class="scroll-body">';
  theses.forEach((t, i) => {
    html += '<div class="thesis"><i>' + String(i + 1).padStart(2, '0') + '</i><span>' + escHTML(t) + '</span></div>';
  });
  html += '</div><div class="rule" style="margin-top:22px"><span>◆</span></div>' +
          '<p class="hint" style="text-align:center;margin-top:14px">Локальный TF-IDF · без интернета</p>';
  ov._body.innerHTML = html;
}

/* ---------------------------------------------------------------
   20. «Вникнуть»
--------------------------------------------------------------- */
async function openTerm(termRaw) {
  const term = String(termRaw).replace(/\s+/g, ' ').replace(/[«»"']/g, '').trim().slice(0, 100);
  if (!term) return;

  hideTermPill();

  const ov = openSheet('Вникнуть',
    '<div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.16em">' +
      '<span class="spinner"></span> ищу в книге…</div>');

  const book = state.current;
  if (!book) { ov._body.innerHTML = '<p class="hint">Книга не открыта.</p>'; return; }

  const dictVal = lookupDictionary(term);
  let fullText = '';
  try { fullText = await getFullText(book); } catch (e) {}

  const defs = findDefinitions(fullText, term);
  const mentions = countMentions(fullText, term);
  const note = await findNote(book.id, term);

  let html = '';

  html += '<div style="font-family:var(--serif);font-size:22px;color:var(--accent);letter-spacing:.04em;margin-bottom:6px">' +
          escHTML(term) + '</div>';
  html += '<p class="hint" style="margin:0 0 22px">упоминаний в книге: ' + mentions + '</p>';

  if (dictVal) {
    html += '<div class="field"><label>Из вашего словаря</label>' +
            '<div class="def-item" style="border-left-color:var(--accent)">' + escHTML(dictVal) + '</div></div>';
  }

  html += '<div class="field"><label>Определения в тексте</label>';
  if (defs.length) {
    defs.forEach(d => { html += '<div class="def-item">' + highlightTerm(d, term) + '</div>'; });
  } else {
    html += '<p class="hint">Явных определений не найдено. Попробуйте выделить слово в другой форме или добавьте свою заметку ниже.</p>';
  }
  html += '</div>';

  html += '<div class="field"><label>Ваша заметка</label>' +
          '<textarea class="term-note" id="note-input" placeholder="Короткое объяснение своими словами…">' +
          escHTML(note ? note.note : '') + '</textarea></div>';

  html += '<div style="display:flex;gap:10px;justify-content:flex-end">' +
            '<button class="btn-ghost" data-act="cancel" style="padding:10px 18px;letter-spacing:.18em">Закрыть</button>' +
            '<button class="btn-ghost btn-solid" data-act="save" style="padding:10px 18px;letter-spacing:.18em">Сохранить</button>' +
          '</div>';

  ov._body.innerHTML = html;

  ov._body.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'cancel') { closeSheet(); return; }
    if (b.dataset.act === 'save') {
      const ta = ov._body.querySelector('#note-input');
      const val = (ta ? ta.value : '').trim();
      if (!val) { toast('Заметка пуста'); return; }
      await saveNote(book.id, term, term, val);
      toast('Сохранено в глоссарий книги');
      closeSheet();
    }
  });
}

/* ---------------------------------------------------------------
   21. Оглавление и глоссарий
--------------------------------------------------------------- */
async function showToc() {
  if (!state.current) return;
  const book = state.current;

  let tabsHtml =
    '<div class="tabs">' +
      '<button data-tab="toc" class="on">Главы</button>' +
      '<button data-tab="glossary">Глоссарий</button>' +
    '</div><div id="toc-content"></div>';

  const ov = openSheet('Содержание', tabsHtml);
  const content = ov._body.querySelector('#toc-content');

  const renderToc = () => {
    let html = '';
    if (book.format === 'epub') {
      if (!state.toc.length) html = '<p class="hint">Оглавление отсутствует.</p>';
      else html = state.toc.map(t =>
        '<button class="toc-item" data-href="' + escHTML(t.href) + '">' + escHTML(t.label || '—') + '</button>'
      ).join('');
    } else {
      const chapters = state.chapters || [];
      html = chapters.map((c, i) =>
        '<button class="toc-item' + (i === state.chapterIndex ? ' active' : '') + '" data-index="' + i + '">' +
        escHTML(c.title || ('Часть ' + (i + 1))) + '</button>'
      ).join('');
    }
    content.innerHTML = html;
  };

  const renderGlossary = async () => {
    content.innerHTML = '<div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.16em"><span class="spinner"></span> загрузка…</div>';
    const list = await getGlossary(book.id);
    if (!list.length) {
      content.innerHTML = '<p class="hint">Глоссарий пуст. Выделите слово в тексте и нажмите «Вникнуть», чтобы сохранить заметку.</p>';
      return;
    }
    content.innerHTML = list.map(g =>
      '<button class="toc-item" data-term="' + escHTML(g.display || g.term) + '">' +
        '<span style="display:block;color:var(--accent);font-size:15px">' + escHTML(g.display || g.term) + '</span>' +
        '<span style="display:block;font-family:var(--ui-font);font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5">' +
          escHTML((g.note || '').slice(0, 140)) + '</span>' +
      '</button>'
    ).join('');
  };

  renderToc();

  ov._body.addEventListener('click', async e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      ov._body.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab));
      if (tab.dataset.tab === 'toc') renderToc();
      else renderGlossary();
      return;
    }

    const item = e.target.closest('.toc-item');
    if (!item) return;

    if (item.dataset.term) {
      closeSheet();
      setTimeout(() => openTerm(item.dataset.term), 220);
      return;
    }
    if (item.dataset.index !== undefined && state.rendition === null) {
      closeSheet();
      renderChapter(parseInt(item.dataset.index, 10), 0);
      return;
    }
    if (item.dataset.href && state.rendition) {
      closeSheet();
      try { await state.rendition.display(item.dataset.href); } catch (err) {}
    }
  });
}

/* ---------------------------------------------------------------
   22. Настройки
--------------------------------------------------------------- */
function settingsBody() {
  const themeBtn = (id, label) =>
    '<button data-theme="' + id + '" class="' + (settings.theme === id ? 'on' : '') + '">' + label + '</button>';

  return (
    '<div class="field"><label>Тема</label><div class="seg" id="set-theme">' +
      themeBtn('abyss', 'Бездна') + themeBtn('parchment', 'Пергамент') + themeBtn('void', 'Пустота') +
    '</div></div>' +

    '<div class="field"><label>Гарнитура</label><div class="seg" id="set-font">' +
      '<button data-serif="1" class="' + (settings.serif ? 'on' : '') + '">Антиква</button>' +
      '<button data-serif="0" class="' + (!settings.serif ? 'on' : '') + '">Гротеск</button>' +
    '</div></div>' +

    '<div class="field"><label>Размер текста · <span id="lbl-fs">' + settings.fontSize + ' px</span></label>' +
      '<input type="range" id="set-fs" min="14" max="30" step="1" value="' + settings.fontSize + '"></div>' +

    '<div class="field"><label>Интерлиньяж · <span id="lbl-lh">' + settings.lineHeight.toFixed(2) + '</span></label>' +
      '<input type="range" id="set-lh" min="1.3" max="2.2" step="0.05" value="' + settings.lineHeight + '"></div>' +

    '<div class="field"><label>Ширина колонки · <span id="lbl-mw">' + settings.maxWidth + ' симв.</span></label>' +
      '<input type="range" id="set-mw" min="44" max="96" step="1" value="' + settings.maxWidth + '"></div>' +

    '<div class="field"><label>Выравнивание</label><div class="seg" id="set-justify">' +
      '<button data-justify="1" class="' + (settings.justify ? 'on' : '') + '">По формату</button>' +
      '<button data-justify="0" class="' + (!settings.justify ? 'on' : '') + '">По левому краю</button>' +
    '</div></div>' +

    '<div class="rule" style="margin:26px 0"><span>◆</span></div>' +

    '<div class="field"><label>Локальный словарь терминов</label>' +
      '<p class="hint" style="margin:0 0 10px">JSON-файл вида <code>{"термин": "простое объяснение"}</code>. Хранится только на устройстве.</p>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<button class="btn-ghost" id="btn-dict" style="padding:10px 18px;letter-spacing:.18em">Загрузить JSON</button>' +
        '<span class="hint" id="dict-status">' + (Object.keys(localDictionary).length
          ? 'загружено терминов: ' + Object.keys(localDictionary).length
          : 'словарь не загружен') + '</span>' +
      '</div>' +
      '<input type="file" id="dict-input" accept=".json,application/json" hidden>' +
    '</div>' +

    '<div class="rule" style="margin:26px 0"><span>◆</span></div>' +

    '<div class="field"><label>Данные</label>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn-ghost" id="btn-wipe" style="padding:10px 18px;letter-spacing:.18em;border-color:rgba(200,90,70,.5);color:#c96a58">Очистить библиотеку</button>' +
      '</div>' +
      '<p class="hint" style="margin:10px 0 0">Все книги, прогресс и глоссарии хранятся локально в IndexedDB.</p>' +
    '</div>'
  );
}

function bindSettingsBody(root) {
  root.querySelector('#set-theme').addEventListener('click', e => {
    const b = e.target.closest('[data-theme]');
    if (!b) return;
    settings.theme = b.dataset.theme;
    applySettings(); saveSettings();
    root.querySelectorAll('#set-theme button').forEach(x => x.classList.toggle('on', x === b));
    applyEpubTheme();
  });

  root.querySelector('#set-font').addEventListener('click', e => {
    const b = e.target.closest('[data-serif]');
    if (!b) return;
    settings.serif = b.dataset.serif === '1';
    applySettings(); saveSettings();
    root.querySelectorAll('#set-font button').forEach(x => x.classList.toggle('on', x === b));
    applyEpubTheme();
  });

  root.querySelector('#set-justify').addEventListener('click', e => {
    const b = e.target.closest('[data-justify]');
    if (!b) return;
    settings.justify = b.dataset.justify === '1';
    applySettings(); saveSettings();
    root.querySelectorAll('#set-justify button').forEach(x => x.classList.toggle('on', x === b));
  });

  const fs = root.querySelector('#set-fs');
  fs.addEventListener('input', () => {
    settings.fontSize = parseInt(fs.value, 10);
    root.querySelector('#lbl-fs').textContent = settings.fontSize + ' px';
    applySettings(); saveSettings(); applyEpubTheme();
  });

  const lh = root.querySelector('#set-lh');
  lh.addEventListener('input', () => {
    settings.lineHeight = parseFloat(lh.value);
    root.querySelector('#lbl-lh').textContent = settings.lineHeight.toFixed(2);
    applySettings(); saveSettings(); applyEpubTheme();
  });

  const mw = root.querySelector('#set-mw');
  mw.addEventListener('input', () => {
    settings.maxWidth = parseInt(mw.value, 10);
    root.querySelector('#lbl-mw').textContent = settings.maxWidth + ' симв.';
    applySettings(); saveSettings();
  });

  const dictBtn = root.querySelector('#btn-dict');
  const dictInput = root.querySelector('#dict-input');
  dictBtn.addEventListener('click', () => dictInput.click());
  dictInput.addEventListener('change', async () => {
    const f = dictInput.files && dictInput.files[0];
    if (!f) return;
    try {
      const txt = await f.text();
      const obj = JSON.parse(txt);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('ожидается объект');
      const clean = {};
      Object.keys(obj).forEach(k => {
        const v = obj[k];
        if (typeof v === 'string') clean[String(k).trim().toLowerCase()] = v;
      });
      localDictionary = clean;
      await DB.put('kv', localDictionary, 'dictionary');
      const st = root.querySelector('#dict-status');
      if (st) st.textContent = 'загружено терминов: ' + Object.keys(localDictionary).length;
      toast('Словарь загружен: ' + Object.keys(localDictionary).length + ' терминов');
    } catch (err) {
      toast('Некорректный JSON: ' + (err.message || err), 4000);
    }
    dictInput.value = '';
  });

  const wipe = root.querySelector('#btn-wipe');
  wipe.addEventListener('click', async () => {
    const ok = await confirmDialog('Удалить все книги, прогресс и глоссарии? Это необратимо.', 'Удалить всё');
    if (!ok) { openSettings(); return; }
    try {
      await DB.clear('books');
      await DB.clear('files');
      await DB.clear('progress');
      await DB.clear('glossary');
    } catch (e) {}
    Object.keys(fullTextCache).forEach(k => delete fullTextCache[k]);
    Object.keys(sentenceCache).forEach(k => delete sentenceCache[k]);
    closeSheet();
    await loadLibrary();
    toast('Библиотека очищена');
  });
}

function openSettings() {
  const ov = openSheet('Настройки', settingsBody());
  bindSettingsBody(ov._body);
}

/* ---------------------------------------------------------------
   23. События
--------------------------------------------------------------- */
function bindEvents() {
  /* ---- библиотека ---- */
  const fileInput = $('#file-input');
  const folderInput = $('#folder-input');
  const folderBtn = $('#btn-import-folder');
  const folderBtn2 = $('#btn-import-folder-2');

  const openFilePicker = () => fileInput.click();
  $('#btn-import').addEventListener('click', openFilePicker);
  $('#btn-import-2').addEventListener('click', openFilePicker);

  fileInput.addEventListener('change', async e => {
    const files = e.target.files;
    if (files && files.length) await handleFiles(files, false);
    e.target.value = '';
  });

  // Папки поддерживаются не везде — показываем кнопку только если поддерживается
  const folderSupported = 'webkitdirectory' in document.createElement('input');
  if (folderSupported) {
    if (folderBtn) folderBtn.style.display = '';
    if (folderBtn2) folderBtn2.style.display = '';

    const openFolderPicker = () => folderInput.click();
    if (folderBtn) folderBtn.addEventListener('click', openFolderPicker);
    if (folderBtn2) folderBtn2.addEventListener('click', openFolderPicker);

    folderInput.addEventListener('change', async e => {
      const files = e.target.files;
      if (files && files.length) await handleFiles(files, true);
      e.target.value = '';
    });
  }

  $('#btn-settings').addEventListener('click', openSettings);

  $('#btn-theme').addEventListener('click', () => {
    const i = THEMES.indexOf(settings.theme);
    settings.theme = THEMES[(i + 1) % THEMES.length];
    applySettings(); saveSettings();
    applyEpubTheme();
    toast('Тема: ' + THEME_NAMES[settings.theme]);
  });

  $('#grid').addEventListener('click', async e => {
    const del = e.target.closest('.book-del');
    if (del) {
      e.stopPropagation();
      const card = del.closest('.book-card');
      if (card) await deleteBook(card.dataset.id);
      return;
    }
    const card = e.target.closest('.book-card');
    if (card) await openBook(card.dataset.id);
  });

  $('#grid').addEventListener('keydown', async e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.book-card');
    if (card) { e.preventDefault(); await openBook(card.dataset.id); }
  });

  /* ---- читалка ---- */
  $('#btn-close-reader').addEventListener('click', closeReader);
  $('#btn-next').addEventListener('click', goNext);
  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-summary').addEventListener('click', showSummary);
  $('#btn-toc').addEventListener('click', showToc);
  $('#btn-reader-settings').addEventListener('click', openSettings);

  $('#reader-body').addEventListener('scroll', () => {
    if (state.current && state.current.format !== 'epub') {
      const chapters = state.chapters || [];
      if (!chapters.length) return;
      const ratio = customRatio();
      setPercent((state.chapterIndex + ratio) / chapters.length);
      saveCustomProgress();
    }
  }, { passive: true });

  $('#reader-body').addEventListener('click', e => {
    const note = e.target.closest('.note-ref');
    if (note) {
      const id = note.dataset.note;
      const html = (state.notes && state.notes[id]) || '<p>Сноска не найдена.</p>';
      openSheet('Сноска', '<div class="scroll-body">' + html + '</div>');
      return;
    }
    const sel = window.getSelection();
    if (sel && sel.toString().trim()) return;
    setBars(!state.barsVisible);
  });

  $('#reader-body').addEventListener('mouseup', captureSelection);
  $('#reader-body').addEventListener('touchend', captureSelection);

  const pill = $('#term-pill');
  pill.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    const t = state.selection;
    if (t) openTerm(t);
  });

  document.addEventListener('pointerdown', e => {
    if (!pill.contains(e.target) && pill.classList.contains('show')) {
      const sel = window.getSelection();
      if (!sel || !sel.toString().trim()) hideTermPill();
    }
  }, true);

  /* ---- клавиатура ---- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (activeSheet) { closeSheet(); return; }
      if (!$('#reader').hidden) { closeReader(); return; }
    }
    if (!activeSheet && $('#reader').hidden === false) {
      if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); goPrev(); }
    }
  });

  window.addEventListener('resize', debounce(() => {
    if (state.rendition) {
      try {
        state.rendition.resize();
        applyEpubTheme();
      } catch (e) {}
    }
  }, 250));

  window.addEventListener('pagehide', () => {
    if (state.current && state.current.format !== 'epub') {
      const chapters = state.chapters || [];
      if (chapters.length) {
        const ratio = customRatio();
        try {
          DB.put('progress', {
            id: state.current.id, chapter: state.chapterIndex, ratio,
            percent: (state.chapterIndex + ratio) / chapters.length,
            updatedAt: Date.now()
          });
        } catch (e) {}
      }
    }
  });
}

/* ---------------------------------------------------------------
   24. Старт
--------------------------------------------------------------- */
(async function init() {
  initPWA();

  await loadSettings();
  applySettings();

  await loadDictionary();

  let dbOk = true;
  try {
    await DB.getAll('books');
  } catch (e) {
    dbOk = false;
    console.error('IndexedDB недоступен', e);
    toast('Хранилище недоступно — книги не сохранятся', 6000);
  }

  await loadLibrary();
  bindEvents();

  if (!dbOk) {
    // Покажем подсказку
    const t = $('#toast');
    if (t) {
      t.textContent = 'Внимание: хранилище браузера недоступно. Возможно, вы в приватном режиме.';
    }
  }

  const boot = $('#boot');
  if (boot) {
    boot.style.transition = 'opacity .4s';
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 420);
  }
})();
