<body>

<div id="night-filter"></div>

  <header class="hero"><h1 class="brand">GRIMOIRE</h1><div class="rule"><span>◆</span></div></header>

      <svg viewBox="0 0 24 24" id="rsvp-icon-pause" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const escHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
let toastTimer=null;
function toast(msg,ms=2400){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),ms)}
const SUPPORTED_EXTS=['epub','fb2','zip','txt','md','markdown','mobi','prc','azw','azw3','docx','html','htm'];
const MAX_FILE_SIZE=200*1024*1024;

/* ---------- IndexedDB ---------- */
const DB=(()=>{let p=null;
const open=()=>p||(p=new Promise((res,rej)=>{let req;try{req=indexedDB.open('grimoire',2)}catch(e){return rej(e)}
req.onupgradeneeded=()=>{const db=req.result;['books','progress','glossary','notes','bookmarks','kv'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:n==='kv'||n==='files'?undefined:'id',autoIncrement:n==='glossary'||n==='notes'||n==='bookmarks'})});if(!db.objectStoreNames.contains('files'))db.createObjectStore('files')};
req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error||new Error('IDB open failed'))}));
const run=(s,m,fn)=>open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(s,m),os=tx.objectStore(s);let r;try{r=fn(os)}catch(e){return rej(e)}tx.oncomplete=()=>res(r?r.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}));
return{get:(s,k)=>run(s,'readonly',o=>o.get(k)),getAll:s=>run(s,'readonly',o=>o.getAll()),put:(s,v,k)=>run(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),del:(s,k)=>run(s,'readwrite',o=>o.delete(k)),clear:s=>run(s,'readwrite',o=>o.clear())}})();

/* ---------- Настройки ---------- */
const FONTS={georgia:{name:'Georgia',family:"Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif",tag:'классика'},palatino:{name:'Palatino',family:"'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif",tag:'книжный'},literata:{name:'Literata',family:"'Literata',Georgia,'Times New Roman',serif",tag:'вовлекает',google:'Literata'},lora:{name:'Lora',family:"'Lora',Georgia,'Times New Roman',serif",tag:'мягкий',google:'Lora'},spectral:{name:'Spectral',family:"'Spectral',Georgia,'Times New Roman',serif",tag:'изящный',google:'Spectral'},crimson:{name:'Crimson',family:"'Crimson Pro',Georgia,'Times New Roman',serif",tag:'книжный',google:'Crimson Pro'},merriweather:{name:'Merriweather',family:"'Merriweather',Georgia,serif",tag:'чёткий',google:'Merriweather'},atkinson:{name:'Atkinson',family:"'Atkinson Hyperlegible',system-ui,sans-serif",tag:'доступный',google:'Atkinson Hyperlegible'},sans:{name:'Grotesk',family:"ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",tag:'система'}};
const DEFAULT_SETTINGS={theme:'abyss',fontSize:19,lineHeight:1.75,fontFamily:'georgia',maxWidth:68,justify:true,nightFilter:0,focusMode:false,ttsRate:1,ttsPitch:1,rsvpSpeed:300,autoScrollSpeed:5,epubFlow:'paginated',autoNight:false};
const THEMES=['abyss','parchment','void'],THEME_NAMES={abyss:'Бездна',parchment:'Пергамент',void:'Пустота'},THEME_COLORS={abyss:'#0a0a0c',parchment:'#e8dec8',void:'#000'};
let settings={...DEFAULT_SETTINGS};
const getFontFamily=k=>(FONTS[k]||FONTS.georgia).family;
function applySettings(){const r=document.documentElement;r.dataset.theme=settings.theme;r.dataset.justify=settings.justify?'1':'0';r.dataset.focus=settings.focusMode?'1':'0';r.style.setProperty('--fs',settings.fontSize+'px');r.style.setProperty('--lh',String(settings.lineHeight));r.style.setProperty('--maxw',String(settings.maxWidth));r.style.setProperty('--reader-font',getFontFamily(settings.fontFamily));r.style.setProperty('--night-opacity',String(settings.nightFilter/100));const m=$('#meta-theme');if(m)m.setAttribute('content',THEME_COLORS[settings.theme]||'#0a0a0c')}
const saveSettings=debounce(()=>DB.put('kv',settings,'settings').catch(()=>{}),400);
async function loadSettings(){try{const s=await DB.get('kv','settings');if(s&&typeof s==='object'){if(!s.fontFamily&&typeof s.serif==='boolean')s.fontFamily=s.serif?'georgia':'sans';settings={...DEFAULT_SETTINGS,...s}}}catch(e){}}

/* ---------- PWA ---------- */
function initPWA(){const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#0a0a0c"/><g fill="none" stroke="#c5a059" stroke-width="5"><circle cx="256" cy="232" r="118"/><path d="M256 114 L358 320 L154 320 Z"/><rect x="72" y="72" width="368" height="368" stroke-opacity=".45"/></g></svg>';
const icon='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
const manifest={name:'GRIMOIRE',short_name:'GRIMOIRE',description:'Автономная библиотека теней',start_url:'.',scope:'.',display:'standalone',orientation:'any',background_color:'#0a0a0c',theme_color:'#0a0a0c',lang:'ru',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'},{src:icon,sizes:'any',type:'image/svg+xml',purpose:'maskable'}]};
try{const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.appendChild(l);const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=icon;document.head.appendChild(ai)}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){const sw=["const C='grimoire-v2';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(h=>{const n=fetch(e.request).then(r=>{if(r&&(r.status===200||r.type==='opaque')){const c=r.clone();caches.open(C).then(k=>k.put(e.request,c)).catch(()=>{})}return r}).catch(()=>h);return h||n}))});"].join('\n');
try{navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{})}catch(e){}}}

/* ---------- Обложки ---------- */
const coverCache=new Map();
function wrapCanvasText(ctx,text,x,y,maxW,lineH,maxLines){const words=String(text).split(/\s+/);const lines=[];let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;if(lines.length>=maxLines)break}else line=test}if(line&&lines.length<maxLines)lines.push(line);const startY=y-((lines.length-1)*lineH)/2;lines.forEach((l,i)=>ctx.fillText(l,x,startY+i*lineH))}
function generateCover(title,author){const W=400,H=600,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');let seed=0;for(const ch of(title+'|'+(author||'')))seed=(seed*31+ch.charCodeAt(0))>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const g=x.createLinearGradient(0,0,W*.6,H);g.addColorStop(0,'#0d0d11');g.addColorStop(.5,'#141419');g.addColorStop(1,'#070709');x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<2800;i++){x.fillStyle='rgba(210,210,220,'+(rnd()*.05).toFixed(3)+')';x.fillRect(rnd()*W,rnd()*H,rnd()*1.5,rnd()*1.5)}
x.strokeStyle='rgba(197,160,89,.32)';x.lineWidth=1;const cx=W/2,cy=H*.29,R=48+rnd()*10;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();x.beginPath();for(let i=0;i<3;i++){const a=-Math.PI/2+i*(2*Math.PI/3),px=cx+Math.cos(a)*R*.85,py=cy+Math.sin(a)*R*.85;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke();
x.strokeStyle='rgba(197,160,89,.22)';x.strokeRect(18.5,18.5,W-37,H-37);x.textAlign='center';x.fillStyle='#c8c8d0';x.font='600 27px Georgia,serif';wrapCanvasText(x,(title||'Без названия').toUpperCase(),W/2,H*.6,W-84,34,4);x.fillStyle='rgba(197,160,89,.72)';x.font='italic 15px Georgia,serif';wrapCanvasText(x,author||'—',W/2,H-74,W-100,20,2);return c.toDataURL('image/jpeg',.86)}
function getCoverFor(b){if(b.cover)return b.cover;if(coverCache.has(b.id))return coverCache.get(b.id);const c=generateCover(b.title,b.author);coverCache.set(b.id,c);return c}

/* ---------- Парсинг ---------- */
function decodeBuffer(data){const bytes=data instanceof Uint8Array?data:new Uint8Array(data);if(!bytes.length)return '';if(bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF)return new TextDecoder('utf-8').decode(bytes.subarray(3));if(bytes[0]===0xFF&&bytes[1]===0xFE)return new TextDecoder('utf-16le').decode(bytes.subarray(2));if(bytes[0]===0xFE&&bytes[1]===0xFF)return new TextDecoder('utf-16be').decode(bytes.subarray(2));try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){}let enc='windows-1251';try{const h=new TextDecoder('latin1').decode(bytes.subarray(0,400)),m=h.match(/encoding\s*=\s*["']([\w\-]+)["']/i);if(m)enc=m[1].toLowerCase()}catch(e){}try{return new TextDecoder(enc).decode(bytes)}catch(e){return new TextDecoder('windows-1251').decode(bytes)}}
const _scratch=document.createElement('div');
function htmlToText(html){if(!html)return '';_scratch.innerHTML=String(html).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|h[1-6]|li|tr|blockquote|section|pre)>/gi,'\n');return(_scratch.textContent||'').replace(/[ \t\u00a0]+/g,' ').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+\n/g,'\n').trim()}
function sanitizeHtml(html){const d=document.createElement('div');d.innerHTML=String(html||'');d.querySelectorAll('script,style,link,meta,iframe,object,embed,audio,video').forEach(e=>e.remove());d.querySelectorAll('*').forEach(el=>{for(const a of[...el.attributes])if(/^on/i.test(a.name))el.removeAttribute(a.name)});return d.innerHTML}
function textLinesToHtml(lines){const blocks=lines.join('\n').split(/\n\s*\n/),out=[];for(const b of blocks){const t=b.trim();if(!t)continue;out.push('<p>'+escHTML(t).replace(/\n/g,'<br>')+'</p>')}return out.join('')||'<p></p>'}
function parsePlain(text,fallbackTitle){const lines=String(text).replace(/\r\n?/g,'\n').split('\n');const headRe=/^\s*(?:(?:глава|часть|книга|chapter|part|book)[\s.:№\d][^.!?]{0,40}|#{1,3}\s+\S.*)$/i;const chapters=[];let cur={title:fallbackTitle||'Начало',lines:[]};for(const line of lines){const t=line.trim();if(t&&t.length<70&&headRe.test(t)&&!/[.!?]$/.test(t)&&cur.lines.join('').trim().length>300){chapters.push(cur);cur={title:t.replace(/^#+\s*/,''),lines:[]}}else cur.lines.push(line)}chapters.push(cur);const out=chapters.map((c,i)=>({title:c.title||('Часть '+(i+1)),html:textLinesToHtml(c.lines)})).filter(c=>c.html!=='<p></p>');return{title:fallbackTitle,author:'',chapters:out.length?out:[{title:'Текст',html:textLinesToHtml(lines)}]}}

else if(ext==='zip'){const zip=await JSZip.loadAsync(await file.arrayBuffer());const entry=Object.values(zip.files).find(f=>!f.dir&&/\.(fb2|txt|md|markdown)$/i.test(f.name));if(!entry)throw new Error('в архиве нет книг');const text=decodeBuffer(await entry.async('uint8array'));const p=entry.name.endsWith('.fb2')?parseFB2(text):parsePlain(text,entry.name);rec={...rec,...p,id,addedAt:Date.now(),size:file.size}}

if(!rec.cover)rec.cover=generateCover(rec.title,rec.author);
if(rec.format!=='epub'&&(!rec.chapters||!rec.chapters.length))throw new Error('текст не извлечён');
await DB.put('books',rec);return rec}

async function showSummary(){if(!state.current)return;const ov=openSheet('Суть','<div class="spinner" style="margin:20px auto;display:block"></div>');const text=await currentChapterText();if(!text||text.length<180){ov._body.innerHTML='<p class="hint">Мало текста для анализа.</p>';return}const theses=summarize(text,4);ov._body.innerHTML='<div class="scroll-body">'+theses.map((t,i)=>`<div class="thesis"><i>${String(i+1).padStart(2,'0')}</i><span>${escHTML(t)}</span></div>`).join('')+'</div>'}
async function openTerm(termRaw){const term=String(termRaw).replace(/\s+/g,' ').replace(/[«»"']/g,'').trim().slice(0,100);if(!term)return;hideTermPill();const ov=openSheet('Вникнуть','<div class="spinner" style="margin:20px auto;display:block"></div>');const book=state.current;if(!book)return;const fullText=await getFullText(book),sentences=fullText.match(/[^.!?…]+[.!?…]+[»"”)]?/g)||[],lowerTerm=term.toLowerCase(),stemL=lowerTerm.slice(0,Math.max(3,Math.min(6,lowerTerm.length))),defs=[];
for(const raw of sentences){const s=raw.trim();if(s.length>30&&s.length<460&&s.toLowerCase().includes(stemL)){if(/(—|–|-|:)\s*это\b/.test(s.toLowerCase())||/означа(ет|ют)/.test(s.toLowerCase())||/называ(ется|ют)/.test(s.toLowerCase())){defs.push(s);if(defs.length>=5)break}}}
let html=`<div style="font-family:var(--serif);font-size:22px;color:var(--accent);margin-bottom:6px">${escHTML(term)}</div>`;if(defs.length){defs.forEach(d=>{html+=`<div class="def-item">${escHTML(d).replace(new RegExp('('+escRe(stemL)+'[а-яёa-z]*)','gi'),'<b>$1</b>')}</div>`})}else html+='<p class="hint">Точных определений не найдено.</p>';ov._body.innerHTML=html}

/* ---------- RSVP / Автоскролл / TTS ---------- */
let rsvpInterval=null,rsvpWords=[],rsvpIndex=0;
async function startRSVP(){const text=await currentChapterText();if(!text||text.length<50)return toast('Мало текста для скорочтения');rsvpWords=text.replace(/[\n\r]+/g,' ').split(/\s+/).filter(w=>w.length>0);rsvpIndex=0;$('#rsvp-overlay').hidden=false;requestAnimationFrame(()=>$('#rsvp-overlay').classList.add('open'));$('#rsvp-speed').value=settings.rsvpSpeed;$('#rsvp-speed-label').textContent=settings.rsvpSpeed+' слов/мин';playRSVP()}
function playRSVP(){if(rsvpInterval)cancelAnimationFrame(rsvpInterval);$('#rsvp-icon-play').style.display='none';$('#rsvp-icon-pause').style.display='block';const delay=60000/settings.rsvpSpeed;let lastTime=performance.now();const tick=time=>{if(!rsvpInterval)return;if(time-lastTime>=delay){if(rsvpIndex>=rsvpWords.length){pauseRSVP();return}const word=rsvpWords[rsvpIndex++],len=word.length;let orpIdx=Math.floor(len*.35);if(len<=2)orpIdx=0;else if(len<=5)orpIdx=1;else if(len<=9)orpIdx=2;else if(len<=13)orpIdx=3;$('#rsvp-left').textContent=word.substring(0,orpIdx);$('#rsvp-orp').textContent=word.charAt(orpIdx)||'';$('#rsvp-right').textContent=word.substring(orpIdx+1);lastTime=time}rsvpInterval=requestAnimationFrame(tick)};rsvpInterval=requestAnimationFrame(tick)}
function pauseRSVP(){cancelAnimationFrame(rsvpInterval);rsvpInterval=null;$('#rsvp-icon-play').style.display='block';$('#rsvp-icon-pause').style.display='none'}
function stopRSVP(){pauseRSVP();$('#rsvp-overlay').classList.remove('open');setTimeout(()=>{$('#rsvp-overlay').hidden=true},300)}
function toggleAutoScroll(){if(state.isAutoScrolling)return stopAutoScroll();if(!state.current||state.current.format==='epub')return toast('Автоскролл недоступен для EPUB');state.isAutoScrolling=true;state.lastScrollY=$('#reader-body').scrollTop;$('#btn-autoscroll').classList.add('active');toast('Автоскролл вкл');loopAutoScroll()}
function stopAutoScroll(){state.isAutoScrolling=false;$('#btn-autoscroll').classList.remove('active');if(state.autoScrollTimer)clearTimeout(state.autoScrollTimer)}
function loopAutoScroll(){if(!state.isAutoScrolling||!state.chapters)return;const body=$('#reader-body');if(Math.abs(body.scrollTop-state.lastScrollY)>10){state.lastScrollY=body.scrollTop}else{body.scrollTop+=settings.autoScrollSpeed*.5;state.lastScrollY=body.scrollTop}
if(body.scrollTop+body.clientHeight>=body.scrollHeight-2){if(state.chapterIndex<state.chapters.length-1)renderChapter(state.chapterIndex+1,0);else{stopAutoScroll();toast('Конец книги')}}else state.autoScrollTimer=setTimeout(loopAutoScroll,50)}
function speakText(text){const S=window.speechSynthesis;if(!S)return toast('Синтез речи не поддерживается');if(state.isSpeaking){S.cancel();state.isSpeaking=false;$('#btn-tts').classList.remove('active');return}
const clean=String(text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(!clean)return toast('Нет текста для озвучки');
const chunks=clean.match(/[^.!?…]{1,250}[.!?…]+[»"”)]?/g)||[clean];
state.isSpeaking=true;$('#btn-tts').classList.add('active');
const done=()=>{state.isSpeaking=false;$('#btn-tts').classList.remove('active')};
chunks.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.rate=settings.ttsRate;u.pitch=settings.ttsPitch;u.lang='ru-RU';if(i===chunks.length-1){u.onend=done;u.onerror=done}S.speak(u)})}
function stopAllActions(){stopAutoScroll();stopRSVP();if(window.speechSynthesis){window.speechSynthesis.cancel()}state.isSpeaking=false;$('#btn-tts').classList.remove('active');hideTermPill()}

/* ---------- Focus Mode ---------- */
function updateFocus(){if(!settings.focusMode)return;const ps=$$('#reader-inner p');if(!ps.length)return;const mid=window.innerHeight/2;let best=null,bestDist=Infinity;ps.forEach(p=>{const r=p.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-mid);if(d<bestDist){bestDist=d;best=p}});ps.forEach(p=>p.classList.toggle('focused',p===best))}

/* ---------- UI: Sheets ---------- */
let _currentOverlay=null;
function openSheet(title,bodyHTML,footerHTML=''){closeSheet();const ov=document.createElement('div');ov.className='overlay';
ov.innerHTML=`<div class="sheet"><div class="sheet-head"><div class="sheet-title">${escHTML(title)}</div><button class="icon-btn" data-sheet-close aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-body">${bodyHTML}</div>${footerHTML?`<div class="sheet-foot">${footerHTML}</div>`:''}</div>`;
document.body.appendChild(ov);ov._body=ov.querySelector('.sheet-body');
requestAnimationFrame(()=>ov.classList.add('open'));
ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-sheet-close]'))closeSheet()});
_currentOverlay=ov;return ov}
function closeSheet(){if(!_currentOverlay)return;const ov=_currentOverlay;_currentOverlay=null;ov.classList.remove('open');setTimeout(()=>{ov.remove()},300)}
function confirmDialog(msg,okLabel='OK'){return new Promise(res=>{const ov=openSheet('Подтверждение',`<p style="font-family:var(--reader-font);font-size:16px;line-height:1.6;margin:0 0 20px">${escHTML(msg)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn-ghost" data-act="cancel">Отмена</button><button class="btn-ghost btn-solid" data-act="ok">${escHTML(okLabel)}</button></div>`);
ov._body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;closeSheet();res(b.dataset.act==='ok')})})}

/* ---------- Term Pill ---------- */
function showTermPill(text){state.selection=text;const pill=$('#term-pill');pill.hidden=false;requestAnimationFrame(()=>pill.classList.add('show'))}
function hideTermPill(){const pill=$('#term-pill');if(!pill)return;pill.classList.remove('show');setTimeout(()=>{if(!pill.classList.contains('show'))pill.hidden=true},250);state.selection=''}

/* ---------- Sheet: Settings ---------- */
function showSettings(){const html=`
<div class="field"><label>Тема</label><div class="seg" data-seg="theme">${THEMES.map(t=>`<button data-val="${t}" class="${settings.theme===t?'on':''}">${THEME_NAMES[t]}</button>`).join('')}</div></div>
<div class="field"><label>Размер шрифта: <span id="fs-val">${settings.fontSize}</span>px</label><input type="range" id="fs" min="14" max="30" value="${settings.fontSize}"></div>
<div class="field"><label>Межстрочный интервал: <span id="lh-val">${settings.lineHeight.toFixed(2)}</span></label><input type="range" id="lh" min="1.3" max="2.2" step="0.05" value="${settings.lineHeight}"></div>
<div class="field"><label>Ширина колонки: <span id="mw-val">${settings.maxWidth}</span>ch</label><input type="range" id="mw" min="40" max="100" value="${settings.maxWidth}"></div>
<div class="field"><label>Шрифт</label><div class="font-grid" data-font-grid>${Object.entries(FONTS).map(([k,f])=>`<button class="font-btn ${settings.fontFamily===k?'on':''}" data-val="${k}"><span style="font-family:${f.family}">Aa</span><small>${f.name} · ${f.tag}</small></button>`).join('')}</div></div>
<div class="field"><label>Выравнивание</label><div class="seg" data-seg="justify"><button data-val="1" class="${settings.justify?'on':''}">По ширине</button><button data-val="0" class="${!settings.justify?'on':''}">По левому</button></div></div>
<div class="field"><label>Ночной фильтр: <span id="nf-val">${settings.nightFilter}</span>%</label><input type="range" id="nf" min="0" max="60" value="${settings.nightFilter}"></div>
<div class="field"><label>Режим фокуса</label><div class="seg" data-seg="focus"><button data-val="0" class="${!settings.focusMode?'on':''}">Выкл</button><button data-val="1" class="${settings.focusMode?'on':''}">Вкл</button></div></div>
<div class="field"><label>Скорость автоскролла: <span id="as-val">${settings.autoScrollSpeed}</span></label><input type="range" id="as" min="1" max="15" value="${settings.autoScrollSpeed}"></div>
<div class="field"><label>Скорость TTS</label><input type="range" id="ttsr" min="0.5" max="2" step="0.1" value="${settings.ttsRate}"></div>
<div class="field"><label>Скорость RSVP: <span id="rs-val">${settings.rsvpSpeed}</span> слов/мин</label><input type="range" id="rsvp-r" min="100" max="1000" step="10" value="${settings.rsvpSpeed}"></div>
<div class="field"><label>Поток EPUB</label><div class="seg" data-seg="epubFlow"><button data-val="paginated" class="${settings.epubFlow==='paginated'?'on':''}">Постранично</button><button data-val="scrolled" class="${settings.epubFlow==='scrolled'?'on':''}">Прокрутка</button></div></div>
<div style="display:flex;gap:10px;margin-top:20px"><button class="btn-ghost" id="btn-show-trash" style="flex:1;justify-content:center">Корзина</button><button class="btn-ghost" id="btn-reset-settings" style="flex:1;justify-content:center;border-color:rgba(200,90,70,.5);color:#c96a58">Сброс</button></div>`;
const ov=openSheet('Настройки',html);
const B=ov._body;
B.querySelectorAll('[data-seg]').forEach(seg=>{const key=seg.dataset.seg;seg.addEventListener('click',e=>{const b=e.target.closest('button[data-val]');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
if(key==='theme')settings.theme=b.dataset.val;
else if(key==='justify')settings.justify=b.dataset.val==='1';
else if(key==='focus')settings.focusMode=b.dataset.val==='1';
else if(key==='epubFlow')settings.epubFlow=b.dataset.val;
applySettings();saveSettings();if(key==='theme'&&state.rendition)applyEpubTheme()})});
B.querySelector('[data-font-grid]').addEventListener('click',e=>{const b=e.target.closest('.font-btn');if(!b)return;B.querySelectorAll('.font-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');settings.fontFamily=b.dataset.val;applySettings();saveSettings();if(state.rendition)applyEpubTheme()});
['fs','lh','mw','nf','as','ttsr','rsvp-r'].forEach(id=>{const el=B.querySelector('#'+id);if(!el)return;el.addEventListener('input',()=>{const v=parseFloat(el.value);
if(id==='fs'){settings.fontSize=v;B.querySelector('#fs-val').textContent=v}
else if(id==='lh'){settings.lineHeight=v;B.querySelector('#lh-val').textContent=v.toFixed(2)}
else if(id==='mw'){settings.maxWidth=v;B.querySelector('#mw-val').textContent=v}
else if(id==='nf'){settings.nightFilter=v;B.querySelector('#nf-val').textContent=v}
else if(id==='as'){settings.autoScrollSpeed=v;B.querySelector('#as-val').textContent=v}
else if(id==='ttsr')settings.ttsRate=v;
else if(id==='rsvp-r'){settings.rsvpSpeed=v;B.querySelector('#rs-val').textContent=v}
applySettings();saveSettings()})});
B.querySelector('#btn-show-trash').addEventListener('click',()=>{closeSheet();showTrash()});
B.querySelector('#btn-reset-settings').addEventListener('click',async()=>{if(await confirmDialog('Сбросить все настройки?','Сбросить')){settings={...DEFAULT_SETTINGS};applySettings();saveSettings();closeSheet();toast('Настройки сброшены')}})}

/* ---------- Sheet: Reader settings ---------- */
function showReaderSettings(){const html=`
<div class="field"><label>Размер шрифта</label><input type="range" id="r-fs" min="14" max="30" value="${settings.fontSize}"></div>
<div class="field"><label>Межстрочный</label><input type="range" id="r-lh" min="1.3" max="2.2" step="0.05" value="${settings.lineHeight}"></div>
<div class="field"><label>Ширина</label><input type="range" id="r-mw" min="40" max="100" value="${settings.maxWidth}"></div>
<div class="field"><label>Шрифт</label><div class="font-grid">${Object.entries(FONTS).map(([k,f])=>`<button class="font-btn ${settings.fontFamily===k?'on':''}" data-val="${k}"><span style="font-family:${f.family}">Aa</span><small>${f.name}</small></button>`).join('')}</div></div>
<div class="field"><label>Выравнивание</label><div class="seg" data-rseg="justify"><button data-val="1" class="${settings.justify?'on':''}">По ширине</button><button data-val="0" class="${!settings.justify?'on':''}">По левому</button></div></div>
<div class="field"><label>Тема</label><div class="seg" data-rseg="theme">${THEMES.map(t=>`<button data-val="${t}" class="${settings.theme===t?'on':''}">${THEME_NAMES[t]}</button>`).join('')}</div></div>`;
const ov=openSheet('Чтение',html),B=ov._body;
B.querySelectorAll('.font-btn').forEach(b=>b.addEventListener('click',()=>{B.querySelectorAll('.font-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');settings.fontFamily=b.dataset.val;applySettings();saveSettings();if(state.rendition)applyEpubTheme()}));
B.querySelectorAll('[data-rseg]').forEach(seg=>{seg.addEventListener('click',e=>{const b=e.target.closest('button[data-val]');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const k=seg.dataset.rseg;if(k==='justify')settings.justify=b.dataset.val==='1';else if(k==='theme')settings.theme=b.dataset.val;applySettings();saveSettings();if(state.rendition)applyEpubTheme()})});
['r-fs','r-lh','r-mw'].forEach(id=>{B.querySelector('#'+id).addEventListener('input',e=>{const v=parseFloat(e.target.value);if(id==='r-fs')settings.fontSize=v;else if(id==='r-lh')settings.lineHeight=v;else settings.maxWidth=v;applySettings();saveSettings()})})}

/* ---------- Sheet: TOC ---------- */
async function showTOC(){let items=[];
if(state.current&&state.current.format==='epub'){items=state.toc.map(t=>({title:t.label,href:t.href,index:null}))}
else{items=(state.chapters||[]).map((c,i)=>({title:c.title,index:i}))}
if(!items.length){openSheet('Содержание','<p class="hint">Содержание недоступно.</p>');return}
const html=items.map(it=>`<button class="toc-item ${it.index===state.chapterIndex?'active':''}" data-idx="${it.index!==null?it.index:''}" data-href="${escHTML(it.href||'')}">${escHTML(it.title)}</button>`).join('');
const ov=openSheet('Содержание',html);
ov._body.addEventListener('click',e=>{const b=e.target.closest('.toc-item');if(!b)return;closeSheet();
if(state.rendition&&b.dataset.href){state.rendition.display(b.dataset.href).catch(()=>toast('Не удалось перейти'))}
else if(b.dataset.idx)renderChapter(parseInt(b.dataset.idx,10),0)})}

/* ---------- Event Bindings ---------- */
function bindEvents(){
// Library
$('#btn-import').addEventListener('click',()=>$('#file-input').click());
$('#btn-import-2').addEventListener('click',()=>$('#file-input').click());
$('#btn-import-folder').addEventListener('click',()=>$('#folder-input').click());
$('#btn-import-folder-2').addEventListener('click',()=>$('#folder-input').click());
$('#file-input').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});
$('#folder-input').addEventListener('change',e=>{handleFiles(e.target.files,true);e.target.value=''});
$('#cover-input').addEventListener('change',onCoverPicked);
$('#btn-settings').addEventListener('click',showSettings);
$('#btn-trash').addEventListener('click',showTrash);
$('#btn-night').addEventListener('click',()=>{const cur=settings.nightFilter>0?0:30;settings.nightFilter=cur;applySettings();saveSettings();toast(cur?'Ночной фильтр вкл':'Ночной фильтр выкл')});
$('#btn-theme').addEventListener('click',()=>{const i=THEMES.indexOf(settings.theme);settings.theme=THEMES[(i+1)%THEMES.length];applySettings();saveSettings();if(state.rendition)applyEpubTheme();toast(THEME_NAMES[settings.theme])});
$('#grid').addEventListener('click',e=>{const del=e.target.closest('.book-del');const card=e.target.closest('.book-card');if(!card)return;const id=card.dataset.id;if(del){e.stopPropagation();showBookMenu(id)}else openBook(id)});
// Reader
$('#btn-close-reader').addEventListener('click',closeReader);
$('#btn-prev').addEventListener('click',goPrev);
$('#btn-next').addEventListener('click',goNext);
$('#btn-toc').addEventListener('click',showTOC);
$('#btn-search').addEventListener('click',showSearchSheet);
$('#btn-bookmark').addEventListener('click',addBookmark);
$('#btn-summary').addEventListener('click',showSummary);
$('#btn-reader-settings').addEventListener('click',showReaderSettings);
$('#btn-rsvp').addEventListener('click',startRSVP);
$('#btn-autoscroll').addEventListener('click',toggleAutoScroll);
$('#btn-tts').addEventListener('click',()=>{if(state.isSpeaking)speakText('');else{const t=currentChapterText();t.then(txt=>speakText(txt))}});
$('#btn-fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else document.exitFullscreen&&document.exitFullscreen().catch(()=>{})});
// Reader body scroll / focus / quick nav
$('#reader-body').addEventListener('scroll',debounce(()=>{updateCustomProgress();updateFocus()},150));
$('#quick-nav').addEventListener('input',e=>{const idx=parseInt(e.target.value,10);if(!isNaN(idx))renderChapter(idx,0)});
// Tap on reader body: bars toggle
$('#reader-body').addEventListener('click',e=>{if(window.getSelection().toString().trim())return;setBars(!state.barsVisible)});
// Swipe on reader body (custom formats)
(()=>{let sx=0,sy=0,active=false;const body=$('#reader-body');body.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true}},{passive:true});body.addEventListener('touchend',e=>{if(!active||!e.changedTouches[0])return;active=false;if(window.getSelection().toString().trim())return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dy)<50){if(dx>0)goPrev();else goNext()}},{passive:true})})();
// Term pill
$('#term-pill').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const t=state.selection;hideTermPill();if(b.dataset.act==='term')openTerm(t);else if(b.dataset.act==='note')showNoteSheet(t);else if(b.dataset.act==='speak')speakText(t)});
// Selection on reader-inner (custom formats)
$('#reader-inner').addEventListener('mouseup',()=>{setTimeout(()=>{const t=window.getSelection().toString().trim();if(t&&t.length>=2&&t.length<=200)showTermPill(t);else hideTermPill()},10)});
$('#reader-inner').addEventListener('touchend',()=>{setTimeout(()=>{const t=window.getSelection().toString().trim();if(t&&t.length>=2&&t.length<=200)showTermPill(t)},200)});
// RSVP
$('#btn-rsvp-close').addEventListener('click',stopRSVP);
$('#btn-rsvp-play').addEventListener('click',()=>{if(rsvpInterval)pauseRSVP();else{if(rsvpIndex>=rsvpWords.length)rsvpIndex=0;playRSVP()}});
$('#rsvp-speed').addEventListener('input',e=>{settings.rsvpSpeed=parseInt(e.target.value,10);$('#rsvp-speed-label').textContent=settings.rsvpSpeed+' слов/мин';saveSettings();if(rsvpInterval){pauseRSVP();playRSVP()}});
$('#rsvp-minus').addEventListener('click',()=>{const el=$('#rsvp-speed');el.value=Math.max(100,parseInt(el.value,10)-50);el.dispatchEvent(new Event('input'))});
$('#rsvp-plus').addEventListener('click',()=>{const el=$('#rsvp-speed');el.value=Math.min(1000,parseInt(el.value,10)+50);el.dispatchEvent(new Event('input'))});
// Keyboard
document.addEventListener('keydown',e=>{if($('#reader').hidden)return;if(e.target.matches('input,textarea'))return;
if(e.key==='ArrowLeft')goPrev();else if(e.key==='ArrowRight')goNext();else if(e.key==='Escape'){if(!$('#rsvp-overlay').hidden)stopRSVP();else closeReader()}});
// Visibility (resume progress)
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.rendition){try{const loc=state.rendition.currentLocation();if(loc&&loc.start)saveEpubProgress(loc)}catch(e){}}})}

/* ---------- Init ---------- */
async function init(){await loadSettings();applySettings();
try{const saved=await DB.get('kv','settings');if(saved)settings={...DEFAULT_SETTINGS,...saved};applySettings()}catch(e){}
bindEvents();initPWA();await loadLibrary();
$('#boot').style.display='none';
window.addEventListener('resize',debounce(()=>{if(state.rendition&&state.rendition.resize)state.rendition.resize()},200))}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
